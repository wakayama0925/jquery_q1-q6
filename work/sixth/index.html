<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../common/css/reset.css">
  <link rel="stylesheet" href="../../common/css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <title>Document</title>
</head>
<body>
  <div class="wrapper" id="wrapper">
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  </div>
  <script src="../../common/js/jquery.js"></script>
  <script>
    // 回答はここに書いてね
    $(function(){
      let encountHtml =
            `
              <p class="name"></p>
              <div>
                <img class="img" src='' alt="ポケモンの画像">
              </div>
              <div>
                <button class="btn" id="catch">捕まえる</button>
                <button class="btn" data-js="reset">逃げる</button>
              </div>
            `
      let doneHtml =
        `
          <p class="name">ゲットしました</p>
          <div>
            <img class="img" src=" " alt="ポケモンの画像">
          </div>
          <button class="btn" data-js="reset">戻る</button>
        `
      let failHtml =
                `
                  <p class="text">逃げられてしまった...</p>
                  <button class="btn mt" data-js="reset">戻る</button>
                `
       let backHTML =
                '<button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>'
                

        
      $('#pokemon_search').on('click',function(){
        const pokemonId = Math.floor(Math.random() * 150) + 1;
        $.ajax({
          url: `https://pokeapi.co/api/v2/pokemon/${pokemonId}/`,
          dataType: 'json',
          
        })

        .done(function(res){

            $("div").html(encountHtml);
            console.log(res.species.url);
            console.log(res.sprites.front_default);
            $('.img').attr('src', res.sprites.front_default);
            $(".btn").on('click',function(){
            var dates =  $(this).data('js');
              if (dates == "reset"){
                $("div").html(backHTML);             
            }
        
      });
         $('#catch').on('click',function(){
          var randomNumber = Math.round( Math.random()*1 );
          $.ajax({ 
              url: 'https://pokeapi.co/api/v2/item/4',
              method: 'GET',
              dataType: 'json'
            }).done(function(res) { 
              if (randomNumber == 1) {
            
              $("div").html(doneHtml);
              $('.img').attr('src', res.sprites.default);
              $(".btn").on('click',function(){
                var dates =  $(this).data('js');
                console.log(dates);
                if (dates == "reset"){
                  $("div").html(backHTML);
                }
              })              
              }else{

                  $("div").html(failHtml);
                  $(".btn").on('click',function(){
                    var dates =  $(this).data('js');
                    console.log(dates);
                    if (dates == "reset"){
                      $("div").html(backHTML);
                      }
                    })                                    
                  } 
              }).fail(function(err) { 
                console.error('エラーが発生しました');
            });
          });
        }).fail(function(err) { 
          console.error('エラーが発生しました');
        })
      });
    });
    
  </script>
</body>
</html>
